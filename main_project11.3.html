// Maths to figure out how to do days until the due date in milliseconds

const millisecondInOneWholeDay = 1000 * 60 * 60 * 24
function CalculateDaysUntilTheDeadline(oneAssignment) {
    const rightNowMoment = new Date();
    const millisecondsRemaining = oneAssignment.dueDate - rightNowMoment;
    const daysRemaining = Math.max(0, millisecondsRemaining/millisecondInOneWholeDay); //get rid of 1/0 = infinity issues
    return daysRemaining;
};

    <script>

      //---- SVG selections -------------------------
      const mousePlayground = d3.select("#MousePlayground");
      const svgSelection = d3.select("#SubjectMatter");

  // ---- tuning dials ---------------------------------------------------------
  const focalLength = 6;
  const upstagenessAddedPerRemainingDay = 1;


  // ---- scene measurements (refreshed on load + resize) ----------------------
  const sceneContainerElement = document.getElementById("Viewport");
  let sceneWidth, sceneHeight, vanishingPointX, horizonY;
  let prosceniumY, prosceniumLength, upstageY, cornerLeft, cornerRight;

  // ---- all of the anchor points for elements within the scene --------------
        function refreshSceneGeometry() {
          sceneWidth  = sceneContainerElement.clientWidth;
          sceneHeight = sceneContainerElement.clientHeight;
          vanishingPointX = sceneWidth / 2;
          horizonY        = sceneHeight / 2;
          prosceniumY      = sceneHeight * 0.9;
          prosceniumLength = sceneWidth * 0.8;
          upstageY         = sceneHeight * 0.35;
          cornerLeft  = (sceneWidth - prosceniumLength) / 2;
          cornerRight = sceneWidth - (sceneWidth - prosceniumLength) / 2;
        }

        //---- crosshair for the mouse ----------------------------------------
        function BuildTheMouseCrosshairGroup() {
          const crosshairGroup = mousePlayground.append("g")
            .attr("id", "CrosshairThatFollowsMouse")
            .attr("stroke", "#cc2e22").attr("stroke-width", 2);
          crosshairGroup.append("line").attr("x1", -12).attr("y1", 0).attr("x2", -4).attr("y2", 0);
          crosshairGroup.append("line").attr("x1", 12).attr("y1", 0).attr("x2", 4).attr("y2", 0);
          crosshairGroup.append("line").attr("x1", 0).attr("y1", -12).attr("x2", 0).attr("y2", -4);
          crosshairGroup.append("line").attr("x1", 0).attr("y1", 12).attr("x2", 0).attr("y2", 4);
          return crosshairGroup;
        }

        const crosshair = BuildTheMouseCrosshairGroup();


      // ---- pyramid rows: fewest rows that hold every assignment ------------------
      function getTriangularNumber(n) {
        if (n < 0) return 0;
        return (n * (n + 1)) / 2;
      }

  let rows, slots;
  for (let i = 1; i <= ArrayOfAllAssignmentObjects.length; i++) {
    if (getTriangularNumber(i) >= ArrayOfAllAssignmentObjects.length) {
      rows = i;
      slots = getTriangularNumber(i);
      break;
    }
  }

  // ---- maths helpers --------------------------------------------------------
  function ConvertDaysLeftIntoDepth(daysLeft) {
    return daysLeft * upstagenessAddedPerRemainingDay;
  }
  function ConvertUpstagenessIntoScaleRatio(upstagenessTotal) {
    return focalLength / (focalLength + upstagenessTotal);
  }
  function scaleRatioFor(oneAssignment) {              // one source of truth
    const daysLeft = CalculateDaysUntilTheDeadline(oneAssignment);
    return ConvertUpstagenessIntoScaleRatio(ConvertDaysLeftIntoDepth(daysLeft));
  }

  // ---- position helpers -----------------------------------------------------
  function getRowAndSlot(i) {
    let row = 0;
    let slotsInThisRow = rows;                 // row 0 = widest (front)
    while (i >= slotsInThisRow) {
      i = i - slotsInThisRow;
      row = row + 1;
      slotsInThisRow = slotsInThisRow - 1;     // each row back has one fewer
    }
    return { row, slotInRow: i, slotsInThisRow };
  }

  function verticalFloorPosition(oneAssignment) {
    return upstageY + (prosceniumY - upstageY) * scaleRatioFor(oneAssignment);
  }

  function horizontalFloorPosition(oneAssignment) {
    const place = getRowAndSlot(oneAssignment.pyramidSlot);
    const thisRowWidth = prosceniumLength * (place.slotsInThisRow / rows);
    const thisRowLeft  = (sceneWidth - thisRowWidth) / 2;

  let slotFraction = (place.slotInRow + 0.5) / place.slotsInThisRow;
  if (place.row % 2 === 1) slotFraction = 1 - slotFraction;   // snake: odd rows reverse

    return thisRowLeft + slotFraction * thisRowWidth;
  }

  // ---- per-runner attribute functions ---------------------------------------
  function runnerRadius(oneAssignment) {
    return 100 * scaleRatioFor(oneAssignment);
  }

  function runnerFloorTransform(oneAssignment) {
    return `translate(${horizontalFloorPosition(oneAssignment)}, ${verticalFloorPosition(oneAssignment)})`;
  }

  // ---- per-runner skews -----------------
      function runnerSkewTransform(oneAssignment) {
        const thisX = horizontalFloorPosition(oneAssignment);
        const edgeFactor = (thisX - vanishingPointX) / (sceneWidth / 2);
        const skinniness = 1 - Math.abs(edgeFactor) * 0.5;
        const turn       = edgeFactor * 25;
        return `rotate(${turn}) scale(${skinniness}, 1)`;  
      }

  // ---- drawing the stage ------
  function DrawTheStage() {

    //---add-on for drawing the runners using alpha mask instead
      const defs = svgSelection.append("defs");
      const mask = defs.append("mask").attr("id", "RunnerMask")
        .attr("mask-type", "alpha")                    // reveal by OPACITY, not brightness
        .attr("maskContentUnits", "objectBoundingBox");
      mask.append("image")
        .attr("href", window.RUNNER_SPRITE)
        .attr("width", 1).attr("height", 1)
        .attr("preserveAspectRatio", "none");

    svgSelection.append("line")
      .attr("x1", 0).attr("y1", horizonY)
      .attr("x2", sceneWidth).attr("y2", horizonY)
      .attr("stroke", "#ffffff").attr("stroke-width", 3);

    svgSelection.append("line")
      .attr("x1", 0).attr("y1", sceneHeight)
      .attr("x2", vanishingPointX).attr("y2", horizonY)
      .attr("stroke", "#ffffff").attr("stroke-width", 3);

    svgSelection.append("line")
      .attr("x1", sceneWidth).attr("y1", sceneHeight)
      .attr("x2", vanishingPointX).attr("y2", horizonY)
      .attr("stroke", "#ffffff").attr("stroke-width", 3);
  }


  // ---- drawing the RECTANGLES ------
  function DrawAllCircles() {

    // ---- filter to uncrossed assignments
    const stillActiveAssignments = ArrayOfAllAssignmentObjects.filter(oneAssignment =>
      !SetOfCompletedAssignmentNames.has(oneAssignment.assignmentName)
    );

    const everyRunnerGroup = svgSelection.append("g")
      .selectAll("g.OneRunnerGroup")
      .data(stillActiveAssignments, oneAssignment => oneAssignment.assignmentName)
      .join("g")
        .attr("class", "OneRunnerGroup")
        .attr("transform", runnerFloorTransform)
        .on("click", clickCompleteAction);


        // ---- red gradient technique ----
      const inkToAlarm = d3.interpolateRgb("#211b14", "#cc2e22");
      function urgencyFor(oneAssignment) {
        const days = CalculateDaysUntilTheDeadline(oneAssignment);
        return days <= 0 ? 1 : Math.max(0, Math.min(1, 1 - days / 10));
      }

// ---- append the image (now a rectangle)


        everyRunnerGroup.append("rect")
        .attr("width",  oneAssignment => 120 * scaleRatioFor(oneAssignment))
        .attr("height", oneAssignment => 320 * scaleRatioFor(oneAssignment))
        .attr("x", oneAssignment => -(60 * scaleRatioFor(oneAssignment)) / 2)
        .attr("y", oneAssignment => -(160 * scaleRatioFor(oneAssignment)))
                .attr("fill", oneAssignment => inkToAlarm(urgencyFor(oneAssignment)))
        .attr("mask", "url(#RunnerMask)")
        .attr("pointer-events", "all")
        .on("contextmenu", function (clickEvent, oneAssignment) {
          clickEvent.preventDefault();
          ShowDetailCardFor(oneAssignment);
        })
        .on("click", clickCompleteAction);

    everyRunnerGroup.append("title")
      .text(oneAssignment => JSON.stringify(oneAssignment.dueDate - new Date(), null, 2));
    
      

  //labelling the front row only; place has to exist
      everyRunnerGroup.each(function (oneAssignment) {
      const place = getRowAndSlot(oneAssignment.pyramidSlot);
      if (place.row !== 0) return;   // only the front row gets a permanent label

      const s = scaleRatioFor(oneAssignment);
      const edgeFactor = (horizontalFloorPosition(oneAssignment) - vanishingPointX) / (sceneWidth / 2);
      const fan = edgeFactor * 30;   // labels fan out more than runners lean

      const labelText = d3.select(this).append("text")
        .attr("class", "FrontRowLabel")
        .attr("y", -(320 * s) - 8)          // above the runner's head
        .attr("text-anchor", "middle")
        .attr("transform", `rotate(${fan})`)  // fan by edge position
        .attr("fill", "#3a2f1a")
        .attr("font-family", "monospace")
        .attr("font-size", 13)
        .text(oneAssignment.className + " · " + oneAssignment.assignmentName.slice(0, 18));

             // measure the text, then insert a cream card BEHIND it
      const box = labelText.node().getBBox();
      d3.select(this).insert("rect", ".FrontRowLabel")   // insert before the text = behind it
        .attr("x", box.x - 6).attr("y", box.y - 3)
        .attr("width", box.width + 12).attr("height", box.height + 6)
        .attr("rx", 3)
        .attr("fill", "#f4ecd8")
        .attr("stroke", "#d8cba8").attr("stroke-width", 1)
        .attr("transform", `rotate(${fan})`);   // fan the same as the label
  });}

      .on("click", clickRestoreAction)

function clickRestoreAction(clickEvent, oneAssignment) {
  SetOfCompletedAssignmentNames.delete(oneAssignment.assignmentName);
  DrawEverything();
}


  //---- runner list hover and label functions ---------------
function FindRunnerNearestTo(pointerX, pointerY) {
  const stillActive = ArrayOfAllAssignmentObjects.filter(oneAssignment =>
    !SetOfCompletedAssignmentNames.has(oneAssignment.assignmentName)
  );

  let nearestRunner = null;
  let smallestDistance = Infinity;

    stillActive.forEach(oneAssignment => {
      const runnerX = horizontalFloorPosition(oneAssignment);
      const runnerY = verticalFloorPosition(oneAssignment);
      // distance from pointer to this runner's feet (Pythagoras)
      const dx = runnerX - pointerX;
      const dy = runnerY - pointerY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < smallestDistance) {
        smallestDistance = distance;
        nearestRunner = oneAssignment;
      }
    });

  return nearestRunner;
}

  d3.select("#TheDetailCard")

      <h3>${oneAssignment.assignmentName}</h3>
      <div class="cardMeta">${oneAssignment.className} · due in ${daysLeft}d</div>
      <div>${oneAssignment.taskText}</div>
      <div style="margin-top:8px">${linkBit}</div>
    `);

  d3.select("#TheDetailCard .cardClose").on("click", () => {
    d3.select("#TheDetailCard").classed("hidden", true);
  });
}

// ------SPARKLES SPARKLE SPARKLE SPARKLE WOWWWW--------

function PlayTheLittleSparkleBurst(centreX, centreY) {
  const burstGroup = mousePlayground.append("g");
  burstGroup.selectAll("circle")
    .data(d3.range(12))
    .join("circle")
      .attr("cx", centreX).attr("cy", centreY).attr("r", 4)
      .attr("fill", () => Math.random() < 0.5 ? "#ff6ec7" : "#ffd6ea")
    .transition().duration(500)
      .attr("cx", () => centreX + (Math.random() - 0.5) * 160)
      .attr("cy", () => centreY + (Math.random() - 0.5) * 160)
      .attr("r", 0).style("opacity", 0)
    .remove();
  burstGroup.transition().delay(500).remove();
}

  //---- callback to draw everything ---------------
                    function DrawEverything() {
                      svgSelection.selectAll("*").remove();
                      svgSelection.attr("viewBox", `0 0 ${sceneWidth} ${sceneHeight}`);
                      DrawTheStage();
                      DrawAllCircles();
                      DrawTheManifestList();
                      UpdateTheRunnerCount();
                    }

  // ---- go -------------------------------------------------------------------


document.addEventListener("DOMContentLoaded", () => {
  refreshSceneGeometry();
  DrawEverything();              // draw scene once at start
  d3.timer(DrawOneFrame);        // clock only, every frame
  setInterval(DrawEverything, 1000);   // redraw the whole scene once a second
});

  window.addEventListener("resize", () => {
    refreshSceneGeometry();
    DrawEverything();
  });

  // ---- labelling the runner closest to mouse ----
  const nearestLabel = mousePlayground.append("text")
  .attr("id", "TheNearestRunnerLabel")
  .attr("fill", "#3a2f1a")
  .attr("font-family", "monospace")
  .attr("font-size", 14)
  .attr("text-anchor", "middle")
  .attr("pointer-events", "none");

  // ---- listening for mouse movements and moving the crosshairs there

d3.select("#Viewport").on("mousemove", function (mouseEvent) {
const pointerPosition = d3.pointer(mouseEvent);
crosshair.attr("transform",
`translate(${pointerPosition[0]}, ${pointerPosition[1]})`);

  
    // find + label the nearest runner
  const nearest = FindRunnerNearestTo(pointerPosition[0], pointerPosition[1]);
  currentlyAimedName = nearest ? nearest.assignmentName : null;   

  if (nearest) {
    nearestLabel
      .attr("x", horizontalFloorPosition(nearest))
      .attr("y", verticalFloorPosition(nearest) + 200 * scaleRatioFor(nearest))
      .text(nearest.assignmentName)
      .attr("opacity", 1);

    d3.select("#TheAimingReadout")
      .text("▸ " + nearest.assignmentName + " · " + Math.ceil(CalculateDaysUntilTheDeadline(nearest)) + "d");
  } else {
    nearestLabel.attr("opacity", 0);
    d3.select("#TheAimingReadout").text("");   // clear it when nothings in shot
  }

  })

  // ---- listening for clicks to add to completed set ------
  function clickCompleteAction(clickEvent, oneAssignment) {
    const clickPosition = d3.pointer(clickEvent, svgSelection.node());
    PlayTheLittleSparkleBurst(clickPosition[0], clickPosition[1]); // SPARKLES SPARKLES I ADDED SPARKLES
    SetOfCompletedAssignmentNames.add(oneAssignment.assignmentName);
    DrawEverything();   // refresh
  }

    </script>
