// Maths to figure out how to do days until the due date in milliseconds

const millisecondInOneWholeDay = 1000 * 60 * 60 * 24
function CalculateDaysUntilTheDeadline(oneAssignment) {
    const rightNowMoment = new Date();
    const millisecondsRemaining = oneAssignment.dueDate - rightNowMoment;
    const daysRemaining = Math.floor(millisecondsRemaining/millisecondInOneWholeDay);
    return daysRemaining;
};

ArrayOfAllAssignmentObjects.forEach(oneAssignment => {
    console.log(CalculateDaysUntilTheDeadline(oneAssignment));

  <div id="Viewport">

    <svg id="SubjectMatter"></svg>

  </div>


<script>
  const svgSelection = d3.select("#SubjectMatter");
  const focalLength = 6
  const upstagenessAddedPerRemainingDay = 1
  function ConvertDaysLeftIntoDepth(daysLeft) {return daysLeft * upstagenessAddedPerRemainingDay;}
  function ConvertUpstagenessIntoScaleRatio(upstagenessTotal) {return focalLength/(focalLength+upstagenessTotal);}

  function DrawAllCircles() {
    
    const everyCircle = svgSelection.append("g")
      .selectAll("circle")
      .data(ArrayOfAllAssignmentObjects)
      .join("circle") 
      .attr("cx", sceneWidth/2)
      .attr("cy", sceneHeight/2)
      .attr("r", oneAssignment => {
        const daysLeft = CalculateDaysUntilTheDeadline(oneAssignment);
        const scaleRatio = ConvertUpstagenessIntoScaleRatio(ConvertDaysLeftIntoDepth(daysLeft));
        return 100 * scaleRatio;
      })
      .attr("fill", "none")
      .attr("pointer-events", "all")
      .attr("stroke", "#ff6ec7")
      .attr("stroke-width", 3)
      ;

      everyCircle.append("title")
      .text((oneAssignment) => JSON.stringify(oneAssignment.dueDate - new Date(), null, 2));

  };

  function DrawTheStage() {
  svgSelection.append("line")
    .attr("x1", 0)
    .attr("y1", vanishingPoint)
    .attr("x2", sceneWidth)
    .attr("y2", vanishingPoint)
    .attr("stroke", "#ffffff")
    .attr("stroke-width", 3);

    svgSelection.append("line")
    .attr("x1", 0)
    .attr("y1", 0)
    .attr("x2", vanishingPoint)
    .attr("y2", vanishingPoint)
    .attr("stroke", "#ffffff")
    .attr("stroke-width", 3);

    svgSelection.append("line")
    .attr("x1", sceneWidth)
    .attr("y1", sceneWidth)
    .attr("x2", vanishingPoint)
    .attr("y2", vanishingPoint)
    .attr("stroke", "#ffffff")
    .attr("stroke-width", 3);

  };

document.addEventListener("DOMContentLoaded", () => {
  DrawAllCircles();
  DrawTheStage();
  svgSelection.attr("viewBox", `0 0 ${sceneWidth} ${sceneHeight}`);
});


//Resizeable canvas
const sceneContainerElement = document.getElementById("Viewport");
let sceneWidth = sceneContainerElement.clientWidth;
let sceneHeight = sceneContainerElement.clientHeight;

//Horizon
let vanishingPoint = sceneWidth/2
